name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=7C3AED&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#a78bfa,#7c3aed
            dist/github-snake-dark.svg?palette=github-dark&color_snake=A78BFA&color_dots=#2d3343,#475569,#6d28d9,#8b5cf6,#22d3ee

      - name: Clip snake viewport to contribution boxes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for svg_path in Path("dist").glob("github-snake*.svg"):
              svg = svg_path.read_text(encoding="utf-8")
              match = re.search(r'<svg viewBox="-16 -32 ([0-9.]+) 192" width="([0-9.]+)" height="192"', svg)
              if not match:
                  raise SystemExit(f"Unexpected snake SVG viewport in {svg_path}")
              width = float(match.group(1)) - 32
              width_text = str(int(width)) if width.is_integer() else f"{width:g}"
              svg = re.sub(
                  r'<svg viewBox="-16 -32 [0-9.]+ 192" width="[0-9.]+" height="192"',
                  f'<svg viewBox="0 0 {width_text} 160" width="{width_text}" height="160"',
                  svg,
                  count=1,
              )
              svg_path.write_text(svg, encoding="utf-8")
          PY

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
